<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Midnight Blocks - Climax</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700&family=M+PLUS+Rounded+1c:wght@800&display=swap');
        
        :root {
            --neon-pink: #ff1493;
            --hot-pink: #ff69b4;
            --dark-violet: #1a001a;
            --climax-red: #ff0033;
        }

        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background: #050005;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #fff;
        }

        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 100;
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
        }

        .bg-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 150vw;
            height: 150vh;
            background: radial-gradient(circle, rgba(255, 20, 147, 0.2) 0%, rgba(26, 0, 26, 0) 70%);
            transform: translate(-50%, -50%);
            z-index: -1;
            animation: heart-beat 4s infinite ease-in-out;
        }

        @keyframes heart-beat {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.8; }
        }

        #game-container {
            position: relative;
            height: 60vh;
            aspect-ratio: 1/2;
            max-height: 500px;
            transition: transform 0.1s;
        }

        #game-board {
            width: 100%;
            height: 100%;
            box-shadow: 0 0 40px rgba(255, 20, 147, 0.5), inset 0 0 20px rgba(255, 20, 147, 0.2);
            border: 3px solid var(--neon-pink);
            background-color: rgba(10, 0, 10, 0.9);
            border-radius: 12px;
        }

        .neon-text {
            font-family: 'Shippori Mincho', serif;
            color: #fff;
            text-shadow: 0 0 5px #fff, 0 0 10px var(--hot-pink), 0 0 20px var(--neon-pink), 0 0 30px var(--climax-red);
        }

        .control-btn {
            background: linear-gradient(145deg, #3d001f, #1a001a);
            border: 1px solid var(--hot-pink);
            color: var(--hot-pink);
            box-shadow: 0 4px 0 #200010, 0 0 10px rgba(255, 20, 147, 0.2);
            transition: all 0.05s ease;
            touch-action: manipulation;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .control-btn:active {
            background: var(--neon-pink);
            color: white;
            transform: translateY(2px);
            box-shadow: 0 2px 0 #200010, 0 0 20px var(--neon-pink);
        }

        .flush {
            position: fixed;
            inset: 0;
            background: white;
            opacity: 0;
            pointer-events: none;
            z-index: 200;
        }

        .flush.active { animation: flush-anim 0.3s ease-out; }
        @keyframes flush-anim { 0% { opacity: 0.6; } 100% { opacity: 0; } }

        .side-panel {
            background: rgba(30, 0, 30, 0.8);
            border: 2px solid rgba(255, 20, 147, 0.4);
            border-radius: 10px;
            padding: 4px;
            box-shadow: 0 0 15px rgba(255, 20, 147, 0.1);
        }

        .shake { animation: shake-anim 0.2s ease-in-out; }
        @keyframes shake-anim {
            0%, 100% { transform: translate(0,0); }
            25% { transform: translate(4px, -4px); }
            50% { transform: translate(-4px, 4px); }
            75% { transform: translate(4px, 4px); }
        }
    </style>
</head>
<body class="p-2">
    <div class="bg-glow"></div>
    <div id="flush-overlay" class="flush"></div>

    <div class="w-full max-w-md flex justify-between items-end mb-2 px-2">
        <h1 class="text-2xl font-black neon-text leading-none italic">Midnight<br><span class="text-sm tracking-widest pl-1 opacity-80">CLIMAX EDITION</span></h1>
        <div class="flex gap-3 items-center">
            <div class="text-right">
                <p class="text-[9px] text-pink-300 font-bold uppercase tracking-tighter">Pleasure Score</p>
                <p id="score" class="text-2xl font-black neon-text leading-none">000000</p>
            </div>
            <button id="btn-fullscreen" class="bg-pink-900/60 text-white text-[10px] px-2 py-1 rounded-full border border-pink-400">全画面</button>
        </div>
    </div>

    <div class="flex gap-2 items-start justify-center w-full max-w-md">
        <!-- HOLD -->
        <div class="flex flex-col items-center gap-1">
            <span class="text-[10px] text-pink-300 font-bold italic">キープ♡</span>
            <div class="side-panel">
                <canvas id="hold-board" width="50" height="50"></canvas>
            </div>
        </div>

        <!-- MAIN -->
        <div id="game-container">
            <canvas id="game-board" width="200" height="400"></canvas>
            <div id="message-overlay" class="absolute inset-0 flex items-center justify-center opacity-0 pointer-events-none transition-all duration-300 transform scale-50 z-20">
                <span id="message-text" class="text-4xl font-black neon-text text-center px-4 italic leading-tight drop-shadow-2xl"></span>
            </div>

            <div id="start-screen" class="absolute inset-0 bg-black/95 flex flex-col items-center justify-center rounded-xl z-50 text-center p-6 border-2 border-pink-600">
                <div id="start-msg" class="mb-6">
                    <p class="text-pink-100 text-lg mb-2 font-bold italic">「ねぇ、もっと中のほうまで…」</p>
                    <p class="text-xs text-pink-400 opacity-70">今夜はあなたを、<br>最高にイかせてあげるわ♡</p>
                </div>
                <button id="btn-start" class="control-btn px-10 py-4 rounded-full font-black text-xl animate-bounce shadow-pink-500/50 shadow-xl">昇天をはじめる</button>
            </div>
        </div>

        <!-- NEXT (5 stages) -->
        <div class="flex flex-col items-center gap-1">
            <span class="text-[10px] text-pink-300 font-bold italic">次は…♡</span>
            <div class="side-panel">
                <canvas id="next-board" width="50" height="250"></canvas>
            </div>
        </div>
    </div>

    <div class="mt-auto w-full max-w-md pb-4 grid grid-cols-4 gap-2 px-2">
        <button id="btn-hold" class="control-btn h-12 rounded-xl text-[11px] font-black border-2">キープ</button>
        <button id="btn-left" class="control-btn h-12 rounded-xl text-3xl">◀</button>
        <button id="btn-down" class="control-btn h-12 rounded-xl text-3xl">▼</button>
        <button id="btn-right" class="control-btn h-12 rounded-xl text-3xl">▶</button>
        
        <button id="btn-rotate-left" class="col-span-1 control-btn h-16 rounded-xl font-black">
            <span class="text-[10px] opacity-70">左に…♡</span>
            <span class="text-xl">↺</span>
        </button>
        <button id="btn-rotate-right" class="col-span-1 control-btn h-16 rounded-xl font-black">
            <span class="text-[10px] opacity-70">右に…♡</span>
            <span class="text-xl">↻</span>
        </button>
        <button id="btn-drop" class="col-span-2 control-btn h-16 rounded-xl font-black bg-gradient-to-br from-pink-600 to-red-900 text-white border-white/50 text-lg italic shadow-lg shadow-red-500/30">
            一気に奥まで…ッ！
        </button>
    </div>

    <script>
        const canvas = document.getElementById('game-board');
        const ctx = canvas.getContext('2d');
        const flushOverlay = document.getElementById('flush-overlay');
        const scoreElement = document.getElementById('score');
        const startScreen = document.getElementById('start-screen');
        const btnStart = document.getElementById('btn-start');
        const messageOverlay = document.getElementById('message-overlay');
        const messageText = document.getElementById('message-text');
        const btnFullscreen = document.getElementById('btn-fullscreen');
        const gameContainer = document.getElementById('game-container');
        
        const nextCanvas = document.getElementById('next-board');
        const nextCtx = nextCanvas.getContext('2d');
        const holdCanvas = document.getElementById('hold-board');
        const holdCtx = holdCanvas.getContext('2d');

        const mainScale = 20;
        const sideScale = 12;
        ctx.scale(mainScale, mainScale);
        nextCtx.scale(sideScale, sideScale);
        holdCtx.scale(sideScale, sideScale);

        const colors = [
            null,
            '#ff00ff', // T
            '#ff1493', // Z
            '#ff0033', // S
            '#ffd700', // O
            '#00ffff', // I
            '#ff69b4', // J
            '#da70d6'  // L
        ];

        const pieces = 'TZSOIJL';

        function createPiece(type) {
            if (type === 'T') return [[0, 0, 0], [1, 1, 1], [0, 1, 0]];
            if (type === 'Z') return [[2, 2, 0], [0, 2, 2], [0, 0, 0]];
            if (type === 'S') return [[0, 3, 3], [3, 3, 0], [0, 0, 0]];
            if (type === 'O') return [[4, 4], [4, 4]];
            if (type === 'I') return [[0, 0, 0, 0], [5, 5, 5, 5], [0, 0, 0, 0], [0, 0, 0, 0]];
            if (type === 'J') return [[6, 0, 0], [6, 6, 6], [0, 0, 0]];
            if (type === 'L') return [[0, 0, 7], [7, 7, 7], [0, 0, 0]];
        }

        let board = createMatrix(10, 20);
        let player = { pos: {x: 0, y: 0}, matrix: null, score: 0, type: null };
        let nextPieces = [];
        let holdPiece = null;
        let canHold = true;
        let dropCounter = 0;
        let dropInterval = 1000;
        let lastTime = 0;
        let isGameOver = true;

        const messages = {
            normal: ["あぁん…♡", "もっと…♡", "そこ、いいの…", "いいわよ…っ♡", "もっと強く…！"],
            multi: ["すごすぎる…ッ♡", "壊れちゃう！！", "イッちゃう…！！", "あ、あああっ！！♡", "最高よ…完璧…♡"],
            danger: ["もう限界…っ", "あぁ、ダメぇ…！", "焦らさないで…"],
            gameover: ["はぁ、はぁ…最高だったわ♡", "また、私を壊して…？", "もう終わりなの…？"]
        };

        function triggerEffects(isHeavy = false) {
            flushOverlay.classList.remove('active');
            void flushOverlay.offsetWidth;
            flushOverlay.classList.add('active');
            gameContainer.classList.add('shake');
            setTimeout(() => gameContainer.classList.remove('shake'), 200);
        }

        function showSexyMessage(type = 'normal') {
            const list = messages[type];
            messageText.innerText = list[Math.floor(Math.random() * list.length)];
            messageOverlay.className = "absolute inset-0 flex items-center justify-center z-20 transition-all duration-300";
            messageOverlay.classList.add('opacity-100', 'scale-110', 'rotate-3');
            setTimeout(() => {
                messageOverlay.classList.remove('opacity-100', 'scale-110');
                messageOverlay.classList.add('opacity-0', 'scale-150');
            }, 800);
        }

        function createMatrix(w, h) {
            const matrix = [];
            while (h--) matrix.push(new Array(w).fill(0));
            return matrix;
        }

        function drawMatrix(matrix, offset, context, isGhost = false) {
            if (!matrix) return;
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        const color = colors[value];
                        context.shadowBlur = isGhost ? 0 : 15;
                        context.shadowColor = color;
                        context.fillStyle = isGhost ? 'rgba(255,255,255,0.08)' : color;
                        context.beginPath();
                        context.roundRect(x + offset.x + 0.05, y + offset.y + 0.05, 0.9, 0.9, 0.2);
                        context.fill();
                        if (!isGhost) {
                            context.shadowBlur = 0;
                            context.fillStyle = 'rgba(255,255,255,0.4)';
                            context.fillRect(x + offset.x + 0.15, y + offset.y + 0.15, 0.4, 0.1);
                        }
                    }
                });
            });
        }

        function getGhostPos() {
            let ghostY = player.pos.y;
            while (!collide(board, { ...player, pos: { x: player.pos.x, y: ghostY + 1 } })) ghostY++;
            return ghostY;
        }

        function draw() {
            ctx.fillStyle = 'rgba(5, 0, 5, 1)';
            ctx.fillRect(0, 0, canvas.width / mainScale, canvas.height / mainScale);
            ctx.strokeStyle = 'rgba(255, 20, 147, 0.05)';
            ctx.lineWidth = 0.05;
            for(let i=0; i<10; i++) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 20); ctx.stroke(); }
            for(let i=0; i<20; i++) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(10, i); ctx.stroke(); }
            drawMatrix(board, {x: 0, y: 0}, ctx);
            if (player.matrix) {
                drawMatrix(player.matrix, {x: player.pos.x, y: getGhostPos()}, ctx, true);
                drawMatrix(player.matrix, player.pos, ctx);
            }
            drawNext();
            drawHold();
        }

        function drawNext() {
            nextCtx.clearRect(0, 0, nextCanvas.width / sideScale, nextCanvas.height / sideScale);
            // Draw 5 next pieces
            nextPieces.slice(0, 5).forEach((type, i) => {
                const matrix = createPiece(type);
                const offX = (4 - matrix[0].length) / 2;
                const offY = (4 - matrix.length) / 2;
                // Scale transparency for pieces further in the future
                nextCtx.globalAlpha = 1 - (i * 0.15); 
                drawMatrix(matrix, {x: offX, y: i * 4 + offY + 0.5}, nextCtx);
            });
            nextCtx.globalAlpha = 1;
        }

        function drawHold() {
            holdCtx.clearRect(0, 0, holdCanvas.width / sideScale, holdCanvas.height / sideScale);
            if (holdPiece) {
                const matrix = createPiece(holdPiece);
                const offX = (4 - matrix[0].length) / 2;
                const offY = (4 - matrix.length) / 2;
                holdCtx.globalAlpha = canHold ? 1 : 0.3;
                drawMatrix(matrix, {x: offX, y: offY}, holdCtx);
                holdCtx.globalAlpha = 1;
            }
        }

        function collide(board, player) {
            const [m, o] = [player.matrix, player.pos];
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 && (board[y + o.y] && board[y + o.y][x + o.x]) !== 0) return true;
                }
            }
            return false;
        }

        function merge(board, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) board[y + player.pos.y][x + player.pos.x] = value;
                });
            });
        }

        function playerDrop() {
            player.pos.y++;
            if (collide(board, player)) {
                player.pos.y--;
                merge(board, player);
                playerReset();
                playerSweep();
                canHold = true;
            }
            dropCounter = 0;
        }

        function playerReset() {
            // Ensure we have at least 12 pieces in the queue to safely show 5 and pick 1
            if (nextPieces.length < 12) {
                const bag = [...pieces].sort(() => Math.random() - 0.5);
                nextPieces.push(...bag);
            }
            player.type = nextPieces.shift();
            player.matrix = createPiece(player.type);
            player.pos.y = 0;
            player.pos.x = Math.floor(board[0].length / 2) - Math.floor(player.matrix[0].length / 2);

            if (collide(board, player)) {
                isGameOver = true;
                const msg = messages.gameover[Math.floor(Math.random() * messages.gameover.length)];
                startScreen.style.display = 'flex';
                document.getElementById('start-msg').innerHTML = `<p class="text-xl neon-text mb-4">昇天完了♡</p><p class="text-pink-200 mb-4">${msg}</p><p class="text-sm opacity-50">Score: ${player.score}</p>`;
            }
            if (board[7].some(v => v !== 0)) showSexyMessage('danger');
        }

        function playerSweep() {
            let rowCount = 0;
            outer: for (let y = board.length - 1; y >= 0; --y) {
                for (let x = 0; x < board[y].length; ++x) if (board[y][x] === 0) continue outer;
                board.unshift(board.splice(y, 1)[0].fill(0));
                ++y; rowCount++;
            }
            if (rowCount > 0) {
                player.score += (rowCount ** 2) * 100;
                scoreElement.innerText = player.score.toString().padStart(6, '0');
                triggerEffects(rowCount >= 3);
                showSexyMessage(rowCount >= 3 ? 'multi' : 'normal');
                dropInterval = Math.max(80, 1000 - (player.score / 50));
            }
        }

        function rotate(matrix, dir) {
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
            }
            if (dir > 0) matrix.forEach(row => row.reverse());
            else matrix.reverse();
        }

        function playerRotate(dir) {
            const pos = player.pos.x;
            let offset = 1;
            rotate(player.matrix, dir);
            while (collide(board, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > player.matrix[0].length) {
                    rotate(player.matrix, -dir);
                    player.pos.x = pos;
                    return;
                }
            }
        }

        function update(time = 0) {
            if (isGameOver) return;
            const deltaTime = time - lastTime;
            lastTime = time;
            dropCounter += deltaTime;
            if (dropCounter > dropInterval) playerDrop();
            draw();
            requestAnimationFrame(update);
        }

        btnFullscreen.onclick = () => {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
            else document.exitFullscreen();
        };

        const bind = (id, fn) => {
            const el = document.getElementById(id);
            const handler = (e) => { e.preventDefault(); if (!isGameOver) fn(); };
            el.addEventListener('touchstart', handler, { passive: false });
            el.addEventListener('mousedown', handler);
        };

        bind('btn-left', () => { player.pos.x--; if (collide(board, player)) player.pos.x++; });
        bind('btn-right', () => { player.pos.x++; if (collide(board, player)) player.pos.x--; });
        bind('btn-down', () => playerDrop());
        bind('btn-rotate-left', () => playerRotate(-1));
        bind('btn-rotate-right', () => playerRotate(1));
        bind('btn-drop', () => {
            let dist = 0;
            while (!collide(board, player)) { player.pos.y++; dist++; }
            player.pos.y--; merge(board, player); 
            if(dist > 2) triggerEffects();
            playerReset(); playerSweep(); canHold = true;
        });
        bind('btn-hold', () => {
            if (!canHold) return;
            if (!holdPiece) { holdPiece = player.type; playerReset(); }
            else { [player.type, holdPiece] = [holdPiece, player.type]; player.matrix = createPiece(player.type); player.pos.y = 0; }
            canHold = false;
        });

        btnStart.onclick = () => {
            board = createMatrix(10, 20);
            player.score = 0; scoreElement.innerText = "000000";
            isGameOver = false; startScreen.style.display = 'none';
            nextPieces = [];
            holdPiece = null; canHold = true;
            playerReset(); lastTime = performance.now(); update();
        };

        window.onload = draw;
    </script>
</body>
</html>
